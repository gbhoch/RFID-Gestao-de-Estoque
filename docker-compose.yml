services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rfid
      POSTGRES_PASSWORD: rfid_secret
      POSTGRES_DB: rfid_assets
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfid -d rfid_assets"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: rfid
      DB_PASS: rfid_secret
      DB_NAME: rfid_assets
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh}
      JWT_ACCESS_TTL: 900s
      JWT_REFRESH_TTL: 7d
      # ERP Oracle (somente leitura) — valores no .env da raiz, nunca aqui
      ERP_ORACLE_HOST: ${ERP_ORACLE_HOST:-}
      ERP_ORACLE_PORT: ${ERP_ORACLE_PORT:-1521}
      ERP_ORACLE_SERVICE: ${ERP_ORACLE_SERVICE:-}
      ERP_ORACLE_USER: ${ERP_ORACLE_USER:-}
      ERP_ORACLE_PASSWORD: ${ERP_ORACLE_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
